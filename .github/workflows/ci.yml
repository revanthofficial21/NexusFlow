name: CI

on:
  push:
    branches: [main, revanth]
  pull_request:

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci --prefix server || npm install --prefix server
      - name: Test
        run: npm test --prefix server

  client:
    name: Client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci --prefix client || npm install --prefix client
      - name: Build
        run: npm run build --prefix client

  e2e:
    name: Database-backed checks
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci --prefix server || npm install --prefix server

      - name: Start API
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/nexusflow
          PORT: 5000
        run: |
          cd server
          nohup npm start > /tmp/server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 1
          done
          echo "API did not start"; cat /tmp/server.log; exit 1

      - name: Smoke test
        env:
          BASE_URL: http://localhost:5000
        run: node server/scripts/smoke-test.js

      # Reported for information: a shared runner cannot promise 5,000/sec, so a
      # low number must not fail the build.
      - name: Ingestion benchmark (reduced rate)
        continue-on-error: true
        env:
          BASE_URL: http://localhost:5000
          RATE: 500
          DURATION: 5
          BATCH: 100
        run: node server/scripts/benchmarkIngestion.js
